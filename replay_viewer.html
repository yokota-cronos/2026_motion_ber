<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>記録の再生 — BER × モーション</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --sub:#667085; --line:#e3e6ec; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;
         display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:10px; padding:5px 12px; background:#1d2330; color:#fff; flex:none; }
  header h1 { font-size:15px; margin:0; font-weight:600; white-space:nowrap; }
  header select { max-width:420px; min-width:0; }
  #calib { font-size:12px; opacity:.85; margin-left:auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* 1 画面に収める: 画面の高さから見出しを引いた残りを、左右の列で分ける */
  main { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; padding:8px 12px; }
  .col { display:flex; flex-direction:column; gap:8px; min-height:0; min-width:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px 10px; min-width:0; min-height:0;
          display:flex; flex-direction:column; }
  .card h2 { font-size:13px; margin:0 0 4px; font-weight:600; display:flex; align-items:center; gap:8px; flex:none; white-space:nowrap; }
  .card h2 small { font-weight:400; color:var(--sub); overflow:hidden; text-overflow:ellipsis; }
  .fill { flex:1; min-height:0; position:relative; }
  .fill > canvas { position:absolute; inset:0; width:100%; height:100%; }
  .grow { flex:1; }
  button, select, input { font:inherit; }
  button { padding:3px 10px; border-radius:6px; border:1px solid #cfd4dc; background:#fff; cursor:pointer; color:var(--ink); }
  button.go { background:#1570ef; border-color:#1570ef; color:#fff; }
  select { padding:2px 6px; border:1px solid #cfd4dc; border-radius:6px; background:#fff; color:var(--ink); }
  label.chk { display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--sub); white-space:nowrap; }
  .bar { display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; flex:none; }
  #time { font-variant-numeric:tabular-nums; font-weight:600; }
  #seek { width:100%; margin:4px 0 0; flex:none; }
  .note { color:var(--sub); font-size:12px; }
  .pair { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; min-height:0; }
  .nums { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; align-items:baseline; font-size:13px; overflow:auto; }
  .nums .k { color:var(--sub); white-space:nowrap; }
  .nums .v { font-variant-numeric:tabular-nums; font-weight:600; }
  .nums .big { font-size:24px; line-height:1.2; }
</style>
</head>
<body>
<header>
  <h1>記録の再生</h1>
  <select id="sess" title="記録フォルダ（~/nfc_vhbr_captures/log/）"></select>
  <button id="open">開く</button>
  <span id="calib"></span>
</header>
<main>
  <div class="col">
    <section class="card grow">
      <h2>動画とマーカー<small id="vidInfo"></small></h2>
      <div class="fill"><canvas id="vid"></canvas></div>
      <div class="bar" style="margin-top:4px">
        <label class="chk" title="OptiTrack のマーカーを、較正したカメラで動画に投影した骨格"><input id="showMk" type="checkbox" checked>マーカーの骨格</label>
        <label class="chk" title="MediaPipe が動画から取った骨格（較正に使った対応点）。コマごとに計算するので少し重い"><input id="showMp" type="checkbox">MediaPipe の骨格</label>
        <label class="chk"><input id="showNm" type="checkbox">マーカー名</label>
        <button id="recal" title="MediaPipe でカメラを較正し直す">較正し直す</button>
      </div>
    </section>
    <section class="card" style="flex:none">
      <div class="bar">
        <button class="go" id="play" style="min-width:80px">▶ 再生</button>
        <label class="chk">速さ<select id="speed"><option value="0.02">×0.02</option><option value="0.1">×0.1</option><option value="0.25">×0.25</option><option value="1" selected>×1</option><option value="2">×2</option></select></label>
        <label class="chk" title="BER の収録 (0.1 秒) と収録の間 (転送待ち) を飛ばして、収録の中だけを再生する"><input id="skip" type="checkbox">収録の中だけ</label>
        <button id="capPrev">◀ 収録</button><button id="capNext">収録 ▶</button>
        <button id="frPrev">◀ フレーム</button><button id="frNext">フレーム ▶</button>
        <span id="time"></span>
      </div>
      <input id="seek" type="range" min="0" max="1" step="any" value="0">
      <canvas id="tl" style="height:78px;cursor:pointer;width:100%;display:block"></canvas>
    </section>
  </div>
  <div class="col">
    <section class="card" style="flex:1.15">
      <h2>① 送ったビット → リーダ出力 → 復調したビット<small id="waveInfo"></small><span style="margin-left:auto"></span>
        <label class="chk">表示幅<select id="span"><option value="10" selected>10 µs</option><option value="20">20 µs</option><option value="50">50 µs</option></select></label></h2>
      <div class="fill"><canvas id="wave"></canvas></div>
    </section>
    <div class="pair" style="flex:1">
      <section class="card"><h2>③ 復調後の IQ<small id="constInfo"></small></h2><div class="fill"><canvas id="iq"></canvas></div></section>
      <section class="card"><h2>④ BER</h2><div class="nums" id="nums"></div></section>
    </div>
  </div>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const C = { blue:"#1f77b4", orange:"#f28e2b", red:"#d62728", green:"#2ca02c", ink:"#1d2330", sub:"#667085", grid:"#e8ebf0" };
const R = { meta:null, t:0, playing:false, last:0, drag:false,
            frBusy:false, frT:-1, frAt:0, im:null, ov:null, panBusy:false, panKey:null, panAt:0, panel:null };
const sup = e => String(e).split("").map(c => "⁻⁰¹²³⁴⁵⁶⁷⁸⁹"["-0123456789".indexOf(c)]).join("");
const sci = v => { if (v == null) return "—"; if (v === 0) return "0"; const e = Math.floor(Math.log10(v)); return `${(v / 10 ** e).toFixed(2)}×10${sup(e)}`; };
const fmtT = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(3).padStart(6, "0")}`;
const capAt = t => R.meta && R.meta.caps.find(c => c.t0 <= t && t <= c.t1);

// canvas を表示の大きさに合わせる (枠いっぱい)
function prep(cv) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  g.font = '12px "Hiragino Sans",system-ui,sans-serif'; return { g, w, h };
}
function axes(g, box, o) {
  const [X0, Y0, X1, Y1] = box;
  const sx = v => X0 + (v - o.xmin) / (o.xmax - o.xmin) * (X1 - X0);
  const sy = v => Y1 - (v - o.ymin) / (o.ymax - o.ymin) * (Y1 - Y0);
  g.strokeStyle = C.grid; g.lineWidth = 1;
  (o.yticks || []).forEach(v => { g.beginPath(); g.moveTo(X0, sy(v)); g.lineTo(X1, sy(v)); g.stroke();
    g.fillStyle = C.sub; g.textAlign = "right"; g.textBaseline = "middle"; g.fillText(String(v), X0 - 4, sy(v)); });
  g.strokeStyle = "#cfd4dc"; g.strokeRect(X0, Y0, X1 - X0, Y1 - Y0);
  if (o.ylabel) { g.save(); g.translate(X0 - 36, (Y0 + Y1) / 2); g.rotate(-Math.PI / 2); g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = C.sub; g.fillText(o.ylabel, 0, 0); g.restore(); }
  return { g, X0, Y0, X1, Y1, sx, sy };
}
function line(a, xs, ys, col, lw) {
  const g = a.g; g.save(); g.beginPath(); g.rect(a.X0, a.Y0, a.X1 - a.X0, a.Y1 - a.Y0); g.clip();
  g.strokeStyle = col; g.lineWidth = lw; g.beginPath();
  xs.forEach((x, i) => { const X = a.sx(x), Y = a.sy(ys[i]); i ? g.lineTo(X, Y) : g.moveTo(X, Y); }); g.stroke(); g.restore();
}
function empty(cv, msg) { const { g, w, h } = prep(cv); g.fillStyle = C.sub; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(msg, w / 2, h / 2); }

// ---------------------------------------------------------------- 記録の一覧と開く
async function listSessions() {
  const L = await (await fetch("/api/replay/sessions")).json();
  const cur = R.meta && R.meta.name;
  $("sess").innerHTML = L.map(s => `<option value="${s.path}" ${s.name === cur ? "selected" : ""}>${s.name}（収録 ${s.caps}・生 ${s.raw}${s.video ? "・動画" : ""}）</option>`).join("");
}
function setMeta(m) {
  R.meta = m; R.t = m && m.caps.length ? m.caps[0].t0 : 0; R.playing = false; R.frT = -1; R.panKey = null; R.ov = null; R.im = null;
  if (!m) return;
  $("seek").max = m.duration;
  $("vidInfo").textContent = `${m.duration.toFixed(1)} 秒・収録 ${m.caps.length}（生データ ${m.n_raw}）・FC/${m.div}・${m.level_dbm} dBm・${m.phase_deg}°`;
  document.title = `記録の再生 — ${m.name}`;
}
$("open").onclick = async () => {
  const r = await (await fetch("/api/replay/open", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path: $("sess").value }) })).json();
  if (r.ok === false) { alert(r.message); return; } setMeta(r.meta);
};
$("recal").onclick = () => fetch("/api/replay/calibrate", { method: "POST", body: "{}" });

// ---------------------------------------------------------------- 動画 + マーカー
async function loadFrame(t) {
  R.frBusy = true; R.frT = t;
  try {
    const ovP = fetch(`/api/replay/overlay?t=${t}&mp=${$("showMp").checked ? 1 : 0}`).then(r => r.json());
    const img = new Image();
    const imP = R.meta.video ? new Promise(res => { img.onload = () => res(img); img.onerror = () => res(null); img.src = `/api/replay/frame.jpg?t=${t}`; }) : Promise.resolve(null);
    const [ov, im] = await Promise.all([ovP, imP]);
    R.ov = ov; R.im = im; drawVideo();
  } catch (e) { } finally { R.frBusy = false; }
}
function drawVideo() {
  const im = R.im, ov = R.ov, { g, w, h } = prep($("vid"));
  const vw = (ov && ov.w) || (im && im.naturalWidth) || 640, vh = (ov && ov.h) || (im && im.naturalHeight) || 480;
  const s = Math.min(w / vw, h / vh), ox = (w - vw * s) / 2, oy = (h - vh * s) / 2;     // 枠に収める (縦横比はそのまま)
  const X = p => ox + p[0] * s, Y = p => oy + p[1] * s;
  g.fillStyle = "#11151c"; g.fillRect(ox, oy, vw * s, vh * s);
  if (im) g.drawImage(im, ox, oy, vw * s, vh * s);
  else { g.fillStyle = "#98a2b3"; g.textAlign = "center"; g.fillText("この記録には動画がありません", w / 2, h / 2); }
  if (ov && ov.mp && ov.mp.points) {
    const P = ov.mp.points; g.strokeStyle = "rgba(255,255,255,.75)"; g.lineWidth = 1.5;
    ov.mp.edges.forEach(([a, b]) => { if (!P[a] || !P[b]) return; g.beginPath(); g.moveTo(X(P[a]), Y(P[a])); g.lineTo(X(P[b]), Y(P[b])); g.stroke(); });
    g.fillStyle = "rgba(255,255,255,.9)"; P.forEach(p => { if (p) { g.beginPath(); g.arc(X(p), Y(p), 2, 0, 6.3); g.fill(); } });
  }
  const L = R.meta && R.meta.layout;
  if ($("showMk").checked && ov && ov.markers && L) {
    const M = ov.markers; g.lineCap = "round";
    L.bones.forEach(([a, b, col]) => { if (!M[a] || !M[b]) return;
      g.strokeStyle = "rgba(0,0,0,.45)"; g.lineWidth = 6; g.beginPath(); g.moveTo(X(M[a]), Y(M[a])); g.lineTo(X(M[b]), Y(M[b])); g.stroke();
      g.strokeStyle = col; g.lineWidth = 3.5; g.stroke(); });
    Object.entries(M).forEach(([n, p]) => { if (!p) return;
      g.fillStyle = L.colors[n] || "#fff"; g.beginPath(); g.arc(X(p), Y(p), 5.5, 0, 6.3); g.fill(); g.strokeStyle = "#fff"; g.lineWidth = 1.5; g.stroke();
      if ($("showNm").checked) { g.font = '11px system-ui,sans-serif'; g.fillStyle = "#fff"; g.strokeStyle = "rgba(0,0,0,.7)"; g.lineWidth = 3; g.textAlign = "left";
        g.strokeText(n, X(p) + 8, Y(p) - 6); g.fillText(n, X(p) + 8, Y(p) - 6); } });
    const miss = Object.entries(M).filter(([, p]) => !p).map(([n]) => n);
    if (miss.length) { g.fillStyle = "#ffb4ab"; g.textAlign = "left"; g.font = '12px system-ui,sans-serif'; g.fillText("見えていない: " + miss.join(", "), ox + 8, oy + vh * s - 10); }
  }
  const c = ov && ov.calib;
  $("calib").textContent = ov && ov.status ? ov.status : c ? `較正: 誤差 ${c.median_px} px（中央値）・カメラの遅れ ${c.lag_s} s` : "";
}

// ---------------------------------------------------------------- ① 送ったビット / リーダ出力 / 復調したビット
function drawWave() {
  const P = R.panel, cv = $("wave"), wv = P && P.view && P.view.wave;
  if (!wv) { empty(cv, P && P.cap ? "この収録には生データがありません（波形は出ません）" : "最初の収録の前です（BER と波形は最初の収録から）"); $("waveInfo").textContent = ""; return; }
  const { g, w, h } = prep(cv), T = wv.span_us, nb = Math.ceil(T / wv.bit_us);
  const a = axes(g, [76, 30, w - 10, h - 46], { xmin: 0, xmax: T, ymin: -1, ymax: 1, ylabel: "リーダ出力 [mV]" });
  const pk = Math.max(1, ...wv.reader_mv.map(Math.abs), ...wv.env_mv) * 1.1;
  const sy = v => a.Y1 - (v + pk) / (2 * pk) * (a.Y1 - a.Y0);
  // 縦軸 (mV)
  g.fillStyle = C.sub; g.textAlign = "right"; g.textBaseline = "middle"; g.strokeStyle = C.grid;
  [-Math.round(pk * .8), 0, Math.round(pk * .8)].forEach(v => { g.beginPath(); g.moveTo(a.X0, sy(v)); g.lineTo(a.X1, sy(v)); g.stroke(); g.fillText(String(v), a.X0 - 4, sy(v)); });
  // 誤ったビットの列と、ビットの境目
  g.fillStyle = "rgba(214,39,40,.13)";
  wv.got.forEach((b, k) => { if (b !== wv.sent[k]) { const x0 = a.sx(k * wv.bit_us), x1 = Math.min(a.X1, a.sx((k + 1) * wv.bit_us)); g.fillRect(x0, a.Y0, x1 - x0, a.Y1 - a.Y0); } });
  g.save(); g.setLineDash([3, 3]); g.strokeStyle = "#98a2b3";
  for (let k = 0; k <= nb; k++) { const x = a.sx(k * wv.bit_us); if (x > a.X1) break; g.beginPath(); g.moveTo(x, a.Y0); g.lineTo(x, a.Y1); g.stroke(); }
  g.restore();
  // リーダ出力と包絡線
  const tt = wv.reader_mv.map((_, i) => i * wv.reader_dt_us), A = { ...a, sy };
  line(A, tt, wv.reader_mv, C.orange, 1); line(A, tt, wv.env_mv, C.ink, 1.7); line(A, tt, wv.env_mv.map(x => -x), C.ink, 1.7);
  // 上に送ったビット、下に復調したビット (誤りは赤)
  const row = (bits, y, title, mark) => {
    g.textAlign = "center"; g.textBaseline = "middle"; g.font = 'bold 14px "Hiragino Sans",system-ui,sans-serif';
    bits.forEach((b, k) => { const x = a.sx((k + 0.5) * wv.bit_us); if (x > a.X1 - 4) return; const bad = wv.got[k] !== wv.sent[k];
      g.fillStyle = bad ? C.red : C.ink; g.fillText(bad && mark ? b + "✕" : String(b), x, y); });
    g.font = '12px "Hiragino Sans",system-ui,sans-serif'; g.textAlign = "right"; g.fillStyle = C.sub; g.fillText(title, a.X0 - 6, y);
  };
  row(wv.sent, a.Y0 - 14, "送ったビット", false);
  row(wv.got, a.Y1 + 14, "復調したビット", true);
  g.fillStyle = C.sub; g.textAlign = "center"; g.textBaseline = "alphabetic"; g.font = '11px "Hiragino Sans",system-ui,sans-serif';
  g.fillText(`時間 [µs]（ペイロードの ${wv.first_bit + 1} ビット目から ${T} µs。橙 = リーダ出力、黒 = 包絡線、赤い列 = 誤ったビット）`, (a.X0 + a.X1) / 2, h - 4);
  $("waveInfo").textContent = `収録 #${P.cap}・フレーム ${P.frame}：誤り ${wv.frame_errors} / ${P.numbers.npay} ビット` +
    (P.held ? "（次の収録まで、この収録の最後のフレームを表示）" : "");
}
// ---------------------------------------------------------------- ③ IQ
function drawIQ() {
  const P = R.panel, cv = $("iq"), c = P && P.view && P.view.const;
  if (!c) { empty(cv, "—"); $("constInfo").textContent = ""; return; }
  const { g, w, h } = prep(cv), m = 2, S = Math.max(40, Math.min(w - 50, h - 30)), X0 = (w - S) / 2 + 14, Y0 = 4;
  const a = axes(g, [X0, Y0, X0 + S, Y0 + S], { xmin: -m, xmax: m, ymin: -m, ymax: m, yticks: [-1, 0, 1], ylabel: "Q" });
  g.strokeStyle = "#cfd4dc"; g.beginPath(); g.moveTo(a.sx(0), a.Y0); g.lineTo(a.sx(0), a.Y1); g.stroke();
  c.i.forEach((x, k) => { if (c.bad[k]) return; g.fillStyle = "rgba(31,119,180,.45)"; g.fillRect(a.sx(x) - 1, a.sy(c.q[k]) - 1, 2.2, 2.2); });
  c.i.forEach((x, k) => { if (!c.bad[k]) return; g.fillStyle = C.red; g.beginPath(); g.arc(a.sx(x), a.sy(c.q[k]), 3, 0, 6.3); g.fill(); });
  g.fillStyle = C.sub; g.textAlign = "center"; g.textBaseline = "top"; g.fillText("I（判定軸）", (a.X0 + a.X1) / 2, a.Y1 + 4);
  $("constInfo").textContent = `赤 = 誤り、EVM ${c.evm} %`;
}
// ---------------------------------------------------------------- ④ 数値
function drawNums() {
  const N = R.panel && R.panel.numbers; if (!N) return;
  const col = v => v == null ? C.sub : v < 1e-5 ? C.green : v < 1e-3 ? "#c08400" : C.red;
  const row = (k, v, cls, style) => `<div class="k">${k}</div><div class="v ${cls || ""}" style="${style || ""}">${v}</div>`;
  const r = N.recent, t = N.total, c = N.cap, at = N.at || {};
  let html = row(`現在の BER<br><span class="note">直近 ${r.expected} フレーム</span>`, r.bits ? sci(r.ber) : "—", "big", `color:${col(r.ber)}`);
  html += row("累積 BER", t.bits ? `${sci(t.ber)} <span class="note">（${t.errors.toLocaleString()} / ${t.bits.toLocaleString()}）</span>` : "—");
  html += row(N.held ? "直前の収録" : "この収録", c ? `#${c.cap}：${sci(c.ber)} <span class="note">（${c.frames}/${c.expected} フレーム）</span>` : `<span class="note">最初の収録の前</span>`);
  html += row("このフレーム", at.frame != null ? `${at.frame}：${at.frame_errors < 0 ? "取得失敗" : `誤り ${at.frame_errors} / ${N.npay}`}` : "—");
  if (c) html += row("レベル・位相差", `${c.level >= 0 ? "+" : ""}${c.level} dBm・${c.phase}°`);
  $("nums").innerHTML = html;
}
async function loadPanel(t) {
  R.panBusy = true;
  try {
    const P = await (await fetch(`/api/replay/panel?t=${t}&span=${$("span").value}`)).json();
    if (P.ok !== false) { R.panel = P; drawWave(); drawIQ(); drawNums(); }
  } catch (e) { } finally { R.panBusy = false; }
}

// ---------------------------------------------------------------- タイムライン
function drawTimeline() {
  const m = R.meta, { g, w, h } = prep($("tl")); if (!m) return;
  const L = 44, Rr = 10, T = 6, B = 18, d = Math.max(m.duration, 1e-6);
  const x = t => L + (w - L - Rr) * t / d, y = b => T + (h - T - B) * (1 - (Math.log10(Math.max(b, 1e-6)) + 6) / 6);
  g.font = "11px system-ui, sans-serif"; g.fillStyle = C.sub; g.strokeStyle = C.grid;
  for (let e = -6; e <= 0; e += 2) { const yy = y(10 ** e); g.beginPath(); g.moveTo(L, yy); g.lineTo(w - Rr, yy); g.stroke(); g.textAlign = "right"; g.fillText(`1e${e}`, L - 4, yy + 4); }
  const step = [1, 2, 5, 10, 20, 30, 60, 120, 300].find(s => d / s <= 12) || 600; g.textAlign = "center";
  for (let t = 0; t <= d + 1e-9; t += step) g.fillText(`${t}s`, x(t), h - 4);
  for (const c of m.caps) { const x0 = x(c.t0), ww = Math.max(2, x(c.t1) - x0); g.fillStyle = c.raw ? C.blue : "#98a2b3";
    if (c.ber == null || c.errors === 0) { g.fillRect(x0, h - B - 4, ww, 4); continue; } const yy = y(c.ber); g.fillRect(x0, yy, ww, h - B - yy); }
  g.strokeStyle = C.red; g.lineWidth = 2; g.beginPath(); g.moveTo(x(R.t), T - 4); g.lineTo(x(R.t), h - B + 2); g.stroke();
  g.fillStyle = C.sub; g.textAlign = "left"; g.fillText("収録ごとの BER（青 = 生データあり。クリックでその時刻へ）", L + 4, T + 9);
}
$("tl").addEventListener("click", e => { if (!R.meta) return; const b = $("tl").getBoundingClientRect(); seek((e.clientX - b.left - 44) / (b.width - 54) * R.meta.duration, false); });

// ---------------------------------------------------------------- 再生の操作
function seek(t, pause) { if (!R.meta) return; R.t = Math.max(0, Math.min(R.meta.duration, t)); if (pause) R.playing = false; }
$("play").onclick = () => { if (!R.meta) return; if (R.t >= R.meta.duration) R.t = 0; R.playing = !R.playing; };
$("seek").addEventListener("input", () => { R.drag = true; seek(+$("seek").value); });
$("seek").addEventListener("change", () => { R.drag = false; });
$("capPrev").onclick = () => { const c = [...R.meta.caps].reverse().find(c => c.t0 < R.t - 1e-3); if (c) seek(c.t0 + 1e-4, true); };
$("capNext").onclick = () => { const c = R.meta.caps.find(c => c.t0 > R.t + 1e-6); if (c) seek(c.t0 + 1e-4, true); };
$("frPrev").onclick = () => seek(R.t - (R.meta.frame_s || 1e-3), true);
$("frNext").onclick = () => seek(R.t + (R.meta.frame_s || 1e-3), true);
["showMk", "showMp", "showNm"].forEach(id => $(id).onchange = () => { R.frT = -1; });
$("span").onchange = () => { R.panKey = null; };
// 窓の大きさが変わったら、今のデータのまま描き直す
new ResizeObserver(() => { drawVideo(); drawWave(); drawIQ(); }).observe(document.querySelector("main"));

function tick(now) {
  const m = R.meta;
  if (m) {
    if (R.playing) {
      R.t += (now - R.last) / 1000 * +$("speed").value;
      if ($("skip").checked && !capAt(R.t)) { const nx = m.caps.find(c => c.t0 > R.t); R.t = nx ? nx.t0 : m.duration; }
      if (R.t >= m.duration) { R.t = m.duration; R.playing = false; }
    }
    if (!R.drag) $("seek").value = R.t;
    $("time").textContent = `${fmtT(R.t)} / ${fmtT(m.duration)}`;
    $("play").textContent = R.playing ? "❚❚ 停止" : "▶ 再生";
    drawTimeline();
    // 動画とマーカー: 前のコマを描き終えてから次を頼む。較正中は 1 秒ごとに状態を見直す
    if (!R.frBusy && (Math.abs(R.frT - R.t) > 1e-4 || (R.ov && R.ov.status && now - R.frAt > 1000))) { R.frAt = now; loadFrame(R.t); }
    // ①③④: テストフレームが変わったら (再生中は 0.25 秒に 1 回まで)
    const c = capAt(R.t);
    const key = c ? `${c.cap}:${Math.floor((R.t - c.t0) / (m.frame_s || 1e-3))}` : `out:${m.caps.filter(q => q.t0 <= R.t).length}`;
    if (key !== R.panKey && !R.panBusy && (!R.playing || now - R.panAt > 250)) { R.panKey = key; R.panAt = now; loadPanel(R.t); }
  }
  R.last = now;
  requestAnimationFrame(tick);
}
(async () => {
  await listSessions();
  const m = await (await fetch("/api/replay/meta")).json();
  if (m) setMeta(m);
  requestAnimationFrame(tick);
})();
</script>
