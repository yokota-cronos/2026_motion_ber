<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>記録の再生 — BER × モーション</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --sub:#667085; --line:#e3e6ec; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 "Hiragino Sans","Yu Gothic",system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:0 12px; height:38px; background:#1d2330; color:#fff; }
  header h1 { font-size:15px; margin:0; font-weight:600; white-space:nowrap; }
  header select { max-width:420px; min-width:0; }
  #calib { font-size:12px; opacity:.85; margin-left:auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lang { display:inline-flex; border:1px solid #475467; border-radius:6px; overflow:hidden; flex:none; }
  .lang button { border:0; border-radius:0; padding:2px 9px; background:transparent; color:#cfd4dc; font-size:12px; }
  .lang button.on { background:#475467; color:#fff; }
  /* 1 画面目 (画面の高さちょうど) = 見出し + 動画 + ①③④。操作の欄はその下 (スクロールして使う。キーでも操作できる) */
  main { height:calc(100vh - 38px); display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; padding:8px 12px; }
  #controls { margin:0 12px 12px; gap:6px; }
  kbd { font:11px ui-monospace,monospace; border:1px solid #cfd4dc; border-bottom-width:2px; border-radius:4px; padding:0 4px; background:#fff; }
  .col { display:flex; flex-direction:column; gap:8px; min-height:0; min-width:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px 10px; min-width:0; min-height:0;
          display:flex; flex-direction:column; }
  .card h2 { font-size:13px; margin:0 0 4px; font-weight:600; display:flex; align-items:center; gap:8px; flex:none; white-space:nowrap; }
  .card h2 small { font-weight:400; color:var(--sub); overflow:hidden; text-overflow:ellipsis; }
  .fill { flex:1; min-height:0; position:relative; }
  .fill > canvas { position:absolute; inset:0; width:100%; height:100%; }
  .grow { flex:1; }
  button, select, input { font:inherit; }
  button { padding:3px 10px; border-radius:6px; border:1px solid #cfd4dc; background:#fff; cursor:pointer; color:var(--ink); }
  button.go { background:#1570ef; border-color:#1570ef; color:#fff; }
  select { padding:2px 6px; border:1px solid #cfd4dc; border-radius:6px; background:#fff; color:var(--ink); }
  label.chk { display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--sub); white-space:nowrap; }
  .bar { display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; flex:none; }
  #time { font-variant-numeric:tabular-nums; font-weight:600; }
  #seek { width:100%; margin:4px 0 0; flex:none; }
  .note { color:var(--sub); font-size:12px; }
  .pair { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; min-height:0; }
  .nums { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; align-items:baseline; font-size:13px; overflow:auto; }
  .nums .k { color:var(--sub); white-space:nowrap; }
  .nums .v { font-variant-numeric:tabular-nums; font-weight:600; }
  .nums .big { font-size:24px; line-height:1.2; }
  #ber4 { flex:none; }
  #ber4 .val { font-size:26px; font-weight:700; line-height:1.15; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="title">記録の再生</h1>
  <select id="sess" data-i18n-title="sessTitle"></select>
  <button id="open" data-i18n="open">開く</button>
  <span id="calib"></span>
  <span class="lang" title="表示言語 / Language"><button id="langJP">JP</button><button id="langEN">EN</button></span>
</header>
<main>
  <div class="col">
    <section class="card grow">
      <h2><span data-i18n="video">動画とマーカー</span><small id="vidInfo"></small></h2>
      <div class="fill"><canvas id="vid"></canvas></div>
    </section>
  </div>
  <div class="col">
    <section class="card" style="flex:1.15">
      <h2><span style="margin-left:auto"></span>
        <label class="chk"><span data-i18n="span">表示幅</span><select id="span"><option value="10" selected>10 µs</option><option value="20">20 µs</option><option value="50">50 µs</option></select></label></h2>
      <div class="fill"><canvas id="wave"></canvas></div>
    </section>
    <div class="pair" style="flex:1">
      <section class="card"><h2><span data-i18n="iq">③ 復調後の IQ</span><small id="constInfo"></small></h2><div class="fill"><canvas id="iq"></canvas></div></section>
      <section class="card"><h2>④ BER</h2><div id="ber4"></div><div class="fill"><canvas id="diag"></canvas></div></section>
    </div>
  </div>
</main>
<section class="card" id="controls">
  <div class="bar">
    <label class="chk" data-i18n-title="showMkTitle"><input id="showMk" type="checkbox" checked><span data-i18n="showMk">マーカーの骨格</span></label>
    <label class="chk" data-i18n-title="showMpTitle"><input id="showMp" type="checkbox"><span data-i18n="showMp">MediaPipe の骨格</span></label>
    <label class="chk"><input id="showNm" type="checkbox"><span data-i18n="showNm">マーカー名</span></label>
    <label class="chk" data-i18n-title="cutTitle"><input id="cut" type="checkbox" checked><span data-i18n="cut">人物だけ（背景を薄く）</span></label>
    <button id="recal" data-i18n="recal" data-i18n-title="recalTitle">較正し直す</button>
  </div>
  <div class="bar">
    <button class="go" id="play" style="min-width:80px">▶ 再生</button>
    <label class="chk"><span data-i18n="speed">速さ</span><select id="speed"><option value="0.02">×0.02</option><option value="0.1">×0.1</option><option value="0.25">×0.25</option><option value="1" selected>×1</option><option value="2">×2</option></select></label>
    <label class="chk" data-i18n-title="skipTitle"><input id="skip" type="checkbox"><span data-i18n="skip">収録の中だけ</span></label>
    <button id="capPrev" data-i18n="capPrev">◀ 収録</button><button id="capNext" data-i18n="capNext">収録 ▶</button>
    <button id="frPrev" data-i18n="frPrev">◀ フレーム</button><button id="frNext" data-i18n="frNext">フレーム ▶</button>
    <span id="time"></span>
  </div>
  <input id="seek" type="range" min="0" max="1" step="any" value="0">
  <canvas id="tl" style="height:78px;cursor:pointer;width:100%;display:block"></canvas>
  <div class="note" id="keys"></div>
</section>
<script>
"use strict";
const $ = id => document.getElementById(id);
const C = { blue:"#1f77b4", orange:"#f28e2b", red:"#d62728", green:"#2ca02c", ink:"#1d2330", sub:"#667085", grid:"#e8ebf0" };
const R = { meta:null, t:0, playing:false, last:0, drag:false,
            frBusy:false, frT:-1, frAt:0, im:null, ov:null, panBusy:false, panKey:null, panAt:0, panel:null };
const sup = e => String(e).split("").map(c => "⁻⁰¹²³⁴⁵⁶⁷⁸⁹"["-0123456789".indexOf(c)]).join("");
const sci = v => { if (v == null) return "—"; if (v === 0) return "0"; const e = Math.floor(Math.log10(v)); return `${(v / 10 ** e).toFixed(2)}×10${sup(e)}`; };
const fmtT = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(3).padStart(6, "0")}`;
const capAt = t => R.meta && R.meta.caps.find(c => c.t0 <= t && t <= c.t1);

// ---------------------------------------------------------------- 表示言語 (JP / EN)
// 文言はすべてここ。関数のものは数を差し込む。HTML は data-i18n (中身) / data-i18n-title (title) で引く
const I18N = {
  jp: {
    title: "記録の再生", open: "開く", sessTitle: "記録フォルダ（~/nfc_vhbr_captures/log/）",
    video: "動画とマーカー", showMk: "マーカーの骨格", showMp: "MediaPipe の骨格", showNm: "マーカー名",
    showMkTitle: "OptiTrack のマーカーを、較正したカメラで動画に投影した骨格",
    showMpTitle: "MediaPipe が動画から取った骨格（較正に使った対応点）。コマごとに計算するので少し重い",
    recal: "較正し直す", recalTitle: "MediaPipe でカメラを較正し直す",
    speed: "速さ", skip: "収録の中だけ", skipTitle: "BER の収録 (0.1 秒) と収録の間 (転送待ち) を飛ばして、収録の中だけを再生する",
    capPrev: "◀ 収録", capNext: "収録 ▶", frPrev: "◀ フレーム", frNext: "フレーム ▶", play: "▶ 再生", pause: "❚❚ 停止",
    cut: "人物だけ（背景を薄く）", cutTitle: "MediaPipe で人物を切り出し、背景を薄くする。初めて開いた記録は裏で全コマを処理する（2 分の動画で約 3 分）",
    cutProgress: (a, b) => `人物の切り出し ${a}/${b}`,
    keys: "キー操作: <kbd>Space</kbd> 再生 / 停止　<kbd>←</kbd><kbd>→</kbd> 1 フレーム　<kbd>Shift</kbd>+<kbd>←</kbd><kbd>→</kbd> 1 収録",
    wave: "① 送ったビット → リーダ出力 → 復調したビット", span: "表示幅", iq: "③ 復調後の IQ",
    sessOpt: (s) => `${s.name}（収録 ${s.caps}・生 ${s.raw}${s.video ? "・動画" : ""}）`,
    vidInfo: (m) => `${m.duration.toFixed(1)} 秒・収録 ${m.caps.length}（生データ ${m.n_raw}）・FC/${m.div}・${m.level_dbm} dBm・${m.phase_deg}°`,
    docTitle: (n) => `記録の再生 — ${n}`,
    noVideo: "この記録には動画がありません", missing: "見えていない: ", loading: "読み込み中…",
    calib: (c) => `較正: 誤差 ${c.median_px} px（中央値）・カメラの遅れ ${c.lag_s} s`,
    noRaw: "この収録には生データがありません（波形は出ません）", beforeFirst: "最初の収録の前です（BER と波形は最初の収録から）",
    reader: "リーダ出力 [mV]", sent: "送ったビット", got: "復調したビット",
    waveAxis: (b, T) => `時間 [µs]（ペイロードの ${b} ビット目から ${T} µs。橙 = リーダ出力、黒 = 包絡線、赤い列 = 誤ったビット）`,
    waveInfo: (P, e, n) => `収録 #${P.cap}・フレーム ${P.frame}：誤り ${e} / ${n} ビット`,
    held: "（次の収録まで、この収録の最後のフレームを表示）",
    iAxis: "I（判定軸）", constInfo: (evm) => `赤 = 誤り、EVM ${evm} %`,
    recent: (n) => `現在の BER<br><span class="note">直近 ${n} フレーム</span>`, total: "累積 BER",
    thisCap: "この収録", prevCap: "直前の収録", frames: (a, b) => `（${a}/${b} フレーム）`, beforeFirstShort: "最初の収録の前",
    thisFrame: "このフレーム", lost: "取得失敗", errs: (e, n) => `誤り ${e} / ${n}`, levelPhase: "レベル・位相差",
    phaseShort: "位相差", ber4sub: (t, c) => `累積 ${t}　・　${c}`, capShort: (n, b) => `収録 #${n}: ${b}`,
    timeline: "収録ごとの BER（青 = 生データあり。クリックでその時刻へ）",
  },
  en: {
    title: "Replay", open: "Open", sessTitle: "Recording folder (~/nfc_vhbr_captures/log/)",
    video: "Video and markers", showMk: "Marker skeleton", showMp: "MediaPipe skeleton", showNm: "Marker names",
    showMkTitle: "OptiTrack markers projected onto the video with the calibrated camera",
    showMpTitle: "Skeleton detected by MediaPipe (the points used for calibration). Computed per frame, so a little slow",
    recal: "Recalibrate", recalTitle: "Calibrate the camera again with MediaPipe",
    speed: "Speed", skip: "Captures only", skipTitle: "Skip the gaps between BER captures (USB transfer) and play only inside captures",
    capPrev: "◀ Capture", capNext: "Capture ▶", frPrev: "◀ Frame", frNext: "Frame ▶", play: "▶ Play", pause: "❚❚ Pause",
    cut: "Person only (fade background)", cutTitle: "Cut out the person with MediaPipe and fade the background. A recording opened for the first time is processed in the background (about 3 min for a 2-min video)",
    cutProgress: (a, b) => `Person cut-out ${a}/${b}`,
    keys: "Keys: <kbd>Space</kbd> play / pause　<kbd>←</kbd><kbd>→</kbd> one frame　<kbd>Shift</kbd>+<kbd>←</kbd><kbd>→</kbd> one capture",
    wave: "① Sent bits → reader output → demodulated bits", span: "Span", iq: "③ IQ after demodulation",
    sessOpt: (s) => `${s.name} (${s.caps} captures, ${s.raw} raw${s.video ? ", video" : ""})`,
    vidInfo: (m) => `${m.duration.toFixed(1)} s · ${m.caps.length} captures (${m.n_raw} raw) · FC/${m.div} · ${m.level_dbm} dBm · ${m.phase_deg}°`,
    docTitle: (n) => `Replay — ${n}`,
    noVideo: "No video in this recording", missing: "Not visible: ", loading: "Loading…",
    calib: (c) => `Calibration: error ${c.median_px} px (median) · camera lag ${c.lag_s} s`,
    noRaw: "No raw data in this capture (no waveform)", beforeFirst: "Before the first capture (BER and waveforms start there)",
    reader: "Reader output [mV]", sent: "Sent bits", got: "Demodulated",
    waveAxis: (b, T) => `Time [µs] (${T} µs from payload bit ${b}. Orange = reader output, black = envelope, red columns = bit errors)`,
    waveInfo: (P, e, n) => `Capture #${P.cap} · frame ${P.frame}: ${e} / ${n} bit errors`,
    held: " (showing the last frame of this capture until the next one)",
    iAxis: "I (decision axis)", constInfo: (evm) => `red = error, EVM ${evm} %`,
    recent: (n) => `Current BER<br><span class="note">last ${n} frame${n === 1 ? "" : "s"}</span>`, total: "Cumulative BER",
    thisCap: "This capture", prevCap: "Previous capture", frames: (a, b) => `(${a}/${b} frames)`, beforeFirstShort: "before the first capture",
    thisFrame: "This frame", lost: "not acquired", errs: (e, n) => `${e} / ${n} errors`, levelPhase: "Level · phase",
    phaseShort: "Phase", ber4sub: (t, c) => `cumulative ${t}  ·  ${c}`, capShort: (n, b) => `capture #${n}: ${b}`,
    timeline: "BER per capture (blue = raw data saved; click to jump)",
  },
};
// 較正の途中でサーバが返す文言 (日本語) を英語にする
const STATUS_EN = [
  [/^MediaPipe で骨格を取っています (\d+)\/(\d+)/, (m) => `Detecting pose with MediaPipe ${m[1]}/${m[2]}`],
  [/^MediaPipe を準備しています/, () => "Preparing MediaPipe (downloads the model the first time)"],
  [/^カメラの位置と向きを探しています/, () => "Solving the camera position and orientation"],
  [/^較正の準備中/, () => "Preparing calibration"],
  [/^MediaPipe が人を見つけたコマが少なすぎます/, () => "MediaPipe found a person in too few frames"],
  [/^マーカーと MediaPipe の点の組が足りません/, () => "Not enough marker / MediaPipe pairs"],
  [/^動画かモーションがありません/, () => "No video or motion in this recording"],
  [/^較正できません/, () => "Calibration failed"],
];
let LANG = "jp";
try { if (localStorage.getItem("replayLang") === "en") LANG = "en"; } catch (e) { }
{ const q = new URLSearchParams(location.search).get("lang"); if (q === "en" || q === "jp") LANG = q; }   // ?lang=en で開いても選べる
const T = (k, ...a) => { const v = I18N[LANG][k]; return typeof v === "function" ? v(...a) : v; };
const trStatus = s => { if (LANG === "jp" || !s) return s; for (const [re, f] of STATUS_EN) { const m = s.match(re); if (m) return f(m); } return s; };
function applyLang() {
  document.documentElement.lang = LANG === "en" ? "en" : "ja";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = T(el.dataset.i18nTitle); });
  $("keys").innerHTML = T("keys");
  $("langJP").classList.toggle("on", LANG === "jp"); $("langEN").classList.toggle("on", LANG === "en");
}
function setLang(l) {
  LANG = l; try { localStorage.setItem("replayLang", l); } catch (e) { }
  applyLang(); listSessions();
  if (R.meta) { $("vidInfo").textContent = T("vidInfo", R.meta); document.title = T("docTitle", R.meta.name); }
  drawVideo(); drawWave(); drawIQ(); drawNums();
}

// canvas を表示の大きさに合わせる (枠いっぱい)
function prep(cv) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  g.font = '12px "Hiragino Sans",system-ui,sans-serif'; return { g, w, h };
}
function axes(g, box, o) {
  const [X0, Y0, X1, Y1] = box;
  const sx = v => X0 + (v - o.xmin) / (o.xmax - o.xmin) * (X1 - X0);
  const sy = v => Y1 - (v - o.ymin) / (o.ymax - o.ymin) * (Y1 - Y0);
  g.strokeStyle = C.grid; g.lineWidth = 1;
  (o.yticks || []).forEach(v => { g.beginPath(); g.moveTo(X0, sy(v)); g.lineTo(X1, sy(v)); g.stroke();
    g.fillStyle = C.sub; g.textAlign = "right"; g.textBaseline = "middle"; g.fillText(String(v), X0 - 4, sy(v)); });
  g.strokeStyle = "#cfd4dc"; g.strokeRect(X0, Y0, X1 - X0, Y1 - Y0);
  if (o.ylabel) { g.save(); g.translate(X0 - 36, (Y0 + Y1) / 2); g.rotate(-Math.PI / 2); g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = C.sub; g.fillText(o.ylabel, 0, 0); g.restore(); }
  return { g, X0, Y0, X1, Y1, sx, sy };
}
function line(a, xs, ys, col, lw) {
  const g = a.g; g.save(); g.beginPath(); g.rect(a.X0, a.Y0, a.X1 - a.X0, a.Y1 - a.Y0); g.clip();
  g.strokeStyle = col; g.lineWidth = lw; g.beginPath();
  xs.forEach((x, i) => { const X = a.sx(x), Y = a.sy(ys[i]); i ? g.lineTo(X, Y) : g.moveTo(X, Y); }); g.stroke(); g.restore();
}
function empty(cv, msg) { const { g, w, h } = prep(cv); g.fillStyle = C.sub; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(msg, w / 2, h / 2); }

// ---------------------------------------------------------------- 記録の一覧と開く
async function listSessions() {
  const L = await (await fetch("/api/replay/sessions")).json();
  const cur = R.meta && R.meta.name;
  $("sess").innerHTML = L.map(s => `<option value="${s.path}" ${s.name === cur ? "selected" : ""}>${T("sessOpt", s)}</option>`).join("");
}
function setMeta(m) {
  R.meta = m; R.t = m && m.caps.length ? m.caps[0].t0 : 0; R.playing = false; R.frT = -1; R.panKey = null; R.ov = null; R.im = null;
  if (!m) return;
  $("seek").max = m.duration;
  [...$("sess").options].forEach(o => { o.selected = o.value.replace(/\/g, "/").endsWith("/" + m.name); });   // 一覧も開いている記録に合わせる
  $("vidInfo").textContent = T("vidInfo", m);
  document.title = T("docTitle", m.name);
}
$("open").onclick = async () => {
  const r = await (await fetch("/api/replay/open", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path: $("sess").value }) })).json();
  if (r.ok === false) { alert(r.message); return; } setMeta(r.meta);
};
$("recal").onclick = () => fetch("/api/replay/calibrate", { method: "POST", body: "{}" });

// ---------------------------------------------------------------- 動画 + マーカー
async function loadFrame(t) {
  R.frBusy = true; R.frT = t;
  try {
    const ovP = fetch(`/api/replay/overlay?t=${t}&mp=${$("showMp").checked ? 1 : 0}`).then(r => r.json());
    const img = new Image();
    const imP = R.meta.video ? new Promise(res => { img.onload = () => res(img); img.onerror = () => res(null); img.src = `/api/replay/frame.jpg?t=${t}&cut=${$("cut").checked ? 1 : 0}`; }) : Promise.resolve(null);
    const [ov, im] = await Promise.all([ovP, imP]);
    R.ov = ov; R.im = im; drawVideo();
  } catch (e) { } finally { R.frBusy = false; }
}
function drawVideo() {
  const im = R.im, ov = R.ov, { g, w, h } = prep($("vid"));
  const vw = (ov && ov.w) || (im && im.naturalWidth) || 640, vh = (ov && ov.h) || (im && im.naturalHeight) || 480;
  const s = Math.min(w / vw, h / vh), ox = (w - vw * s) / 2, oy = (h - vh * s) / 2;     // 枠に収める (縦横比はそのまま)
  const X = p => ox + p[0] * s, Y = p => oy + p[1] * s;
  g.fillStyle = "#11151c"; g.fillRect(ox, oy, vw * s, vh * s);
  if (im) g.drawImage(im, ox, oy, vw * s, vh * s);
  else { g.fillStyle = "#98a2b3"; g.textAlign = "center"; g.fillText(T(R.meta && R.meta.video && !R.ov ? "loading" : "noVideo"), w / 2, h / 2); }
  if (ov && ov.mp && ov.mp.points) {
    const P = ov.mp.points; g.strokeStyle = "rgba(255,255,255,.75)"; g.lineWidth = 1.5;
    ov.mp.edges.forEach(([a, b]) => { if (!P[a] || !P[b]) return; g.beginPath(); g.moveTo(X(P[a]), Y(P[a])); g.lineTo(X(P[b]), Y(P[b])); g.stroke(); });
    g.fillStyle = "rgba(255,255,255,.9)"; P.forEach(p => { if (p) { g.beginPath(); g.arc(X(p), Y(p), 2, 0, 6.3); g.fill(); } });
  }
  const L = R.meta && R.meta.layout;
  if ($("showMk").checked && ov && ov.markers && L) {
    const M = ov.markers; g.lineCap = "round";
    L.bones.forEach(([a, b, col]) => { if (!M[a] || !M[b]) return;
      g.strokeStyle = "rgba(0,0,0,.45)"; g.lineWidth = 6; g.beginPath(); g.moveTo(X(M[a]), Y(M[a])); g.lineTo(X(M[b]), Y(M[b])); g.stroke();
      g.strokeStyle = col; g.lineWidth = 3.5; g.stroke(); });
    Object.entries(M).forEach(([n, p]) => { if (!p) return;
      g.fillStyle = L.colors[n] || "#fff"; g.beginPath(); g.arc(X(p), Y(p), 5.5, 0, 6.3); g.fill(); g.strokeStyle = "#fff"; g.lineWidth = 1.5; g.stroke();
      if ($("showNm").checked) { g.font = '11px system-ui,sans-serif'; g.fillStyle = "#fff"; g.strokeStyle = "rgba(0,0,0,.7)"; g.lineWidth = 3; g.textAlign = "left";
        g.strokeText(n, X(p) + 8, Y(p) - 6); g.fillText(n, X(p) + 8, Y(p) - 6); } });
    const miss = Object.entries(M).filter(([, p]) => !p).map(([n]) => n);
    if (miss.length) { g.fillStyle = "#ffb4ab"; g.textAlign = "left"; g.font = '12px system-ui,sans-serif'; g.fillText(T("missing") + miss.join(", "), ox + 8, oy + vh * s - 10); }
  }
  drawHeadLabel(g, ov, X, Y, s, [ox, oy, ox + vw * s, oy + vh * s]);
  const c = ov && ov.calib;
  const cut = ov && ov.cut && $("cut").checked && ov.cut.done < ov.cut.total ? "　" + T("cutProgress", ov.cut.done, ov.cut.total) : "";
  $("calib").textContent = (ov && ov.status ? trStatus(ov.status) : c ? T("calib", c) : "") + cut;
}

// 人物の頭の上に、いまの BER と位相差を書く。位置は投影したマーカー (胸と両上腕) から決める:
// 胸の真上で、ラベルの下端を肩の高さから 肩幅 x 0.85 上 (頭頂は肩から肩幅の約 0.75 倍上) に置く。
// 動画の枠からははみ出させない。マーカーが無いときは出さない
function drawHeadLabel(g, ov, X, Y, s, box) {
  const M = ov && ov.markers; if (!M) return;
  const { ber, phase, N } = nowValues(); if (!N) return;
  const pts = Object.values(M).filter(Boolean); if (!pts.length) return;
  const ru = M.R_upperarm, lu = M.L_upperarm, ch = M.chest;
  const sw = ru && lu ? Math.hypot(ru[0] - lu[0], ru[1] - lu[1]) : 80;
  const cx = ch ? ch[0] : pts.reduce((a, p) => a + p[0], 0) / pts.length;
  const top = Math.min(...[ch, ru, lu].filter(Boolean).map(p => p[1]));
  const fs = Math.max(12, Math.round(sw * s * 0.085));
  const yb = Y([0, top - 0.85 * sw]);
  const l1 = `BER ${N.recent.bits ? sci(ber) : "—"}`, l2 = `${T("phaseShort")} ${fmtPhase(phase)}　${fmtRate(R.meta && R.meta.div)}`;
  g.font = `700 ${fs}px "Hiragino Sans",system-ui,sans-serif`;
  const bw = Math.max(g.measureText(l1).width, g.measureText(l2).width) + fs * 1.2, bh = fs * 2.7;
  const [bx0, by0, bx1, by1] = box;                       // 動画の枠
  const x = Math.min(Math.max(X([cx, 0]), bx0 + bw / 2 + 4), bx1 - bw / 2 - 4);
  const y0 = Math.min(Math.max(yb - bh, by0 + 4), by1 - bh - 4);
  const bx = x - bw / 2;
  g.fillStyle = "rgba(29,35,48,.82)"; g.beginPath(); g.roundRect(bx, y0, bw, bh, fs * 0.4); g.fill();
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = ber == null ? "#cfd4dc" : ber < 1e-5 ? "#7ee08a" : ber < 1e-3 ? "#ffd166" : "#ff8a80";
  g.fillText(l1, x, y0 + bh * 0.3);
  g.fillStyle = "#fff"; g.fillText(l2, x, y0 + bh * 0.72);
}

// ---------------------------------------------------------------- ① 送ったビット / リーダ出力 / 復調したビット
function drawWave() {
  const P = R.panel, cv = $("wave"), wv = P && P.view && P.view.wave;
  if (!wv) { empty(cv, !P ? T("loading") : P.cap ? T("noRaw") : T("beforeFirst")); return; }
  const { g, w, h } = prep(cv), Tsp = wv.span_us, nb = Math.ceil(Tsp / wv.bit_us);
  const a = axes(g, [90, 30, w - 10, h - 26], { xmin: 0, xmax: Tsp, ymin: -1, ymax: 1, ylabel: T("reader") });
  const pk = Math.max(1, ...wv.reader_mv.map(Math.abs), ...wv.env_mv) * 1.1;
  const sy = v => a.Y1 - (v + pk) / (2 * pk) * (a.Y1 - a.Y0);
  // 縦軸 (mV)
  g.fillStyle = C.sub; g.textAlign = "right"; g.textBaseline = "middle"; g.strokeStyle = C.grid;
  [-Math.round(pk * .8), 0, Math.round(pk * .8)].forEach(v => { g.beginPath(); g.moveTo(a.X0, sy(v)); g.lineTo(a.X1, sy(v)); g.stroke(); g.fillText(String(v), a.X0 - 4, sy(v)); });
  // 誤ったビットの列と、ビットの境目
  g.fillStyle = "rgba(214,39,40,.13)";
  wv.got.forEach((b, k) => { if (b !== wv.sent[k]) { const x0 = a.sx(k * wv.bit_us), x1 = Math.min(a.X1, a.sx((k + 1) * wv.bit_us)); g.fillRect(x0, a.Y0, x1 - x0, a.Y1 - a.Y0); } });
  g.save(); g.setLineDash([3, 3]); g.strokeStyle = "#98a2b3";
  for (let k = 0; k <= nb; k++) { const x = a.sx(k * wv.bit_us); if (x > a.X1) break; g.beginPath(); g.moveTo(x, a.Y0); g.lineTo(x, a.Y1); g.stroke(); }
  g.restore();
  // リーダ出力と包絡線
  const tt = wv.reader_mv.map((_, i) => i * wv.reader_dt_us), A = { ...a, sy };
  line(A, tt, wv.reader_mv, C.orange, 1); line(A, tt, wv.env_mv, C.ink, 1.7); line(A, tt, wv.env_mv.map(x => -x), C.ink, 1.7);
  // 上に送ったビット、下に復調したビット (誤りは赤)
  const row = (bits, y, title, mark) => {
    g.textAlign = "center"; g.textBaseline = "middle"; g.font = 'bold 14px "Hiragino Sans",system-ui,sans-serif';
    bits.forEach((b, k) => { const x = a.sx((k + 0.5) * wv.bit_us); if (x > a.X1 - 4) return; const bad = wv.got[k] !== wv.sent[k];
      g.fillStyle = bad ? C.red : C.ink; g.fillText(bad && mark ? b + "✕" : String(b), x, y); });
    g.font = '12px "Hiragino Sans",system-ui,sans-serif'; g.textAlign = "right"; g.fillStyle = C.sub; g.fillText(title, a.X0 - 6, y);
  };
  row(wv.sent, a.Y0 - 14, T("sent"), false);
  row(wv.got, a.Y1 + 14, T("got"), true);
}
// ---------------------------------------------------------------- ③ IQ
function drawIQ() {
  const P = R.panel, cv = $("iq"), c = P && P.view && P.view.const;
  if (!c) { empty(cv, "—"); $("constInfo").textContent = ""; return; }
  const { g, w, h } = prep(cv), m = 2, S = Math.max(40, Math.min(w - 50, h - 30)), X0 = (w - S) / 2 + 14, Y0 = 4;
  const a = axes(g, [X0, Y0, X0 + S, Y0 + S], { xmin: -m, xmax: m, ymin: -m, ymax: m, yticks: [-1, 0, 1] });
  g.strokeStyle = "#cfd4dc"; g.beginPath(); g.moveTo(a.sx(0), a.Y0); g.lineTo(a.sx(0), a.Y1); g.stroke();
  c.i.forEach((x, k) => { if (c.bad[k]) return; g.fillStyle = "rgba(31,119,180,.45)"; g.fillRect(a.sx(x) - 1, a.sy(c.q[k]) - 1, 2.2, 2.2); });
  c.i.forEach((x, k) => { if (!c.bad[k]) return; g.fillStyle = C.red; g.beginPath(); g.arc(a.sx(x), a.sy(c.q[k]), 3, 0, 6.3); g.fill(); });
  g.fillStyle = C.ink; g.font = '700 15px "Hiragino Sans",system-ui,sans-serif';
  g.textAlign = "center"; g.textBaseline = "top"; g.fillText("I", (a.X0 + a.X1) / 2, a.Y1 + 4);
  g.textAlign = "right"; g.textBaseline = "middle"; g.fillText("Q", a.X0 - 26, (a.Y0 + a.Y1) / 2);
  $("constInfo").textContent = T("constInfo", c.evm);
}
// ---------------------------------------------------------------- ④ BER と回路図
const berColor = v => v == null ? C.sub : v < 1e-5 ? C.green : v < 1e-3 ? "#c08400" : C.red;
// いまの BER (直近のフレーム) と、いまの位相差 [°] (その時刻の収録、収録の間は直前の収録)
function nowValues() {
  const N = R.panel && R.panel.numbers;
  if (!N) return { ber: null, phase: null, N: null };
  return { ber: N.recent.bits ? N.recent.ber : null, phase: N.cap ? N.cap.phase : null, N };
}
const fmtPhase = v => v == null ? "—" : `${+v.toFixed(2)}°`;
// データレート = fc / div (ber_gui の表示と同じ。FC/8 = 13.56 MHz / 8 = 1.695 Mbps)
const FC_HZ = 13.56e6;
const fmtRate = div => div ? `${+(FC_HZ / div / 1e6).toFixed(3)} Mbps` : "";
function drawNums() {
  const { ber, N } = nowValues(); if (!N) return;
  $("ber4").innerHTML = `<div class="val" style="color:${berColor(ber)}">BER: ${N.recent.bits ? sci(ber) : "—"}</div>`;
  drawDiag();
}
// 回路図 (assets/coil_drive.png)。電圧源の丸の中心 [px、元の画像]: 左 (256, 564)、右 (454, 566)、半径 43。
// 左を W1 (基準、0°)、右を W2 (W2 − W1 = 位相差) として、それぞれの横に位相を書く
const DIAG = { img: new Image(), w: 715, h: 691, src: [[256, 564], [454, 566]], r: 43 };
DIAG.img.onload = () => drawDiag();
DIAG.img.src = "/assets/coil_drive.png";
function drawDiag() {
  const cv = $("diag"), { g, w, h } = prep(cv);
  if (!DIAG.img.complete || !DIAG.img.naturalWidth) return;
  const s = Math.min(w / DIAG.w, h / DIAG.h), ox = (w - DIAG.w * s) / 2, oy = (h - DIAG.h * s) / 2;
  g.drawImage(DIAG.img, ox, oy, DIAG.w * s, DIAG.h * s);
  const { phase } = nowValues();
  const fs = Math.max(13, Math.round(46 * s));
  g.font = `700 ${fs}px "Hiragino Sans",system-ui,sans-serif`; g.textBaseline = "middle"; g.fillStyle = "#1d2330";
  const [[x1, y1], [x2, y2]] = DIAG.src, gap = (DIAG.r + 10) * s;
  g.textAlign = "right"; g.fillText("0°", ox + x1 * s - gap, oy + y1 * s);
  g.textAlign = "left"; g.fillText(fmtPhase(phase), ox + x2 * s + gap, oy + y2 * s);
}
async function loadPanel(t) {
  R.panBusy = true;
  try {
    const P = await (await fetch(`/api/replay/panel?t=${t}&span=${$("span").value}`)).json();
    if (P.ok !== false) { R.panel = P; drawWave(); drawIQ(); drawNums(); drawVideo(); }
  } catch (e) { } finally { R.panBusy = false; }
}

// ---------------------------------------------------------------- タイムライン
function drawTimeline() {
  const m = R.meta, { g, w, h } = prep($("tl")); if (!m) return;
  const L = 44, Rr = 10, TOP = 6, B = 18, d = Math.max(m.duration, 1e-6);
  const x = t => L + (w - L - Rr) * t / d, y = b => TOP + (h - TOP - B) * (1 - (Math.log10(Math.max(b, 1e-6)) + 6) / 6);
  g.font = "11px system-ui, sans-serif"; g.fillStyle = C.sub; g.strokeStyle = C.grid;
  for (let e = -6; e <= 0; e += 2) { const yy = y(10 ** e); g.beginPath(); g.moveTo(L, yy); g.lineTo(w - Rr, yy); g.stroke(); g.textAlign = "right"; g.fillText(`1e${e}`, L - 4, yy + 4); }
  const step = [1, 2, 5, 10, 20, 30, 60, 120, 300].find(s => d / s <= 12) || 600; g.textAlign = "center";
  for (let t = 0; t <= d + 1e-9; t += step) g.fillText(`${t}s`, x(t), h - 4);
  for (const c of m.caps) { const x0 = x(c.t0), ww = Math.max(2, x(c.t1) - x0); g.fillStyle = c.raw ? C.blue : "#98a2b3";
    if (c.ber == null || c.errors === 0) { g.fillRect(x0, h - B - 4, ww, 4); continue; } const yy = y(c.ber); g.fillRect(x0, yy, ww, h - B - yy); }
  g.strokeStyle = C.red; g.lineWidth = 2; g.beginPath(); g.moveTo(x(R.t), TOP - 4); g.lineTo(x(R.t), h - B + 2); g.stroke();
  g.fillStyle = C.sub; g.textAlign = "left"; g.fillText(T("timeline"), L + 4, TOP + 9);
}
$("tl").addEventListener("click", e => { if (!R.meta) return; const b = $("tl").getBoundingClientRect(); seek((e.clientX - b.left - 44) / (b.width - 54) * R.meta.duration, false); });

// ---------------------------------------------------------------- 再生の操作
function seek(t, pause) { if (!R.meta) return; R.t = Math.max(0, Math.min(R.meta.duration, t)); if (pause) R.playing = false; }
$("play").onclick = () => { if (!R.meta) return; if (R.t >= R.meta.duration) R.t = 0; R.playing = !R.playing; };
$("seek").addEventListener("input", () => { R.drag = true; seek(+$("seek").value); });
$("seek").addEventListener("change", () => { R.drag = false; });
$("capPrev").onclick = () => { const c = [...R.meta.caps].reverse().find(c => c.t0 < R.t - 1e-3); if (c) seek(c.t0 + 1e-4, true); };
$("capNext").onclick = () => { const c = R.meta.caps.find(c => c.t0 > R.t + 1e-6); if (c) seek(c.t0 + 1e-4, true); };
$("frPrev").onclick = () => seek(R.t - (R.meta.frame_s || 1e-3), true);
$("frNext").onclick = () => seek(R.t + (R.meta.frame_s || 1e-3), true);
["showMk", "showMp", "showNm", "cut"].forEach(id => $(id).onchange = () => { R.frT = -1; });
// キー操作 (操作の欄は 1 画面目の外にあるので)。入力欄・選択欄にいるときは使わない
document.addEventListener("keydown", e => {
  if (!R.meta || /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName) && document.activeElement.type !== "checkbox") return;
  if (e.code === "Space") { e.preventDefault(); $("play").click(); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    const fwd = e.key === "ArrowRight";
    $(e.shiftKey ? (fwd ? "capNext" : "capPrev") : (fwd ? "frNext" : "frPrev")).click();
  }
});
$("span").onchange = () => { R.panKey = null; };
// 窓の大きさが変わったら、今のデータのまま描き直す
new ResizeObserver(() => { drawVideo(); drawWave(); drawIQ(); drawDiag(); }).observe(document.querySelector("main"));

function tick(now) {
  const m = R.meta;
  if (m) {
    if (R.playing) {
      R.t += (now - R.last) / 1000 * +$("speed").value;
      if ($("skip").checked && !capAt(R.t)) { const nx = m.caps.find(c => c.t0 > R.t); R.t = nx ? nx.t0 : m.duration; }
      if (R.t >= m.duration) { R.t = m.duration; R.playing = false; }
    }
    if (!R.drag) $("seek").value = R.t;
    $("time").textContent = `${fmtT(R.t)} / ${fmtT(m.duration)}`;
    $("play").textContent = T(R.playing ? "pause" : "play");
    drawTimeline();
    // 動画とマーカー: 前のコマを描き終えてから次を頼む。較正中は 1 秒ごとに状態を見直す
    if (!R.frBusy && (Math.abs(R.frT - R.t) > 1e-4 || (R.ov && (R.ov.status || (R.ov.cut && R.ov.cut.done < R.ov.cut.total)) && now - R.frAt > 1000))) { R.frAt = now; loadFrame(R.t); }
    // ①③④: テストフレームが変わったら (再生中は 0.25 秒に 1 回まで)
    const c = capAt(R.t);
    const key = c ? `${c.cap}:${Math.floor((R.t - c.t0) / (m.frame_s || 1e-3))}` : `out:${m.caps.filter(q => q.t0 <= R.t).length}`;
    if (key !== R.panKey && !R.panBusy && (!R.playing || now - R.panAt > 250)) { R.panKey = key; R.panAt = now; loadPanel(R.t); }
  }
  R.last = now;
  requestAnimationFrame(tick);
}
$("langJP").onclick = () => setLang("jp");
$("langEN").onclick = () => setLang("en");
(async () => {
  applyLang();
  await listSessions();
  const m = await (await fetch("/api/replay/meta")).json();
  if (m) setMeta(m);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
